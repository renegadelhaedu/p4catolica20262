<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login administrativo</title>
    <style>
        body{font:16px Arial,sans-serif;background:#f3f6fa;color:#172033;min-height:100vh;display:grid;place-items:center;margin:0}
        main{background:#fff;padding:36px;border-radius:12px;width:min(380px,calc(100% - 56px));box-shadow:0 8px 30px #0002}
        label{display:block;margin:16px 0 6px}input{width:100%;padding:11px;box-sizing:border-box;border:1px solid #cbd5e1;border-radius:6px}
        button{width:100%;margin-top:22px;padding:12px;background:#173b63;color:white;border:0;border-radius:6px;font-weight:bold;cursor:pointer}
        .erro{color:#a11}a{color:#173b63}
    </style>
</head>
<body><main>
    <h1>Acesso administrativo</h1>
    <p>Entre com uma conta marcada como administradora.</p>
    {% if mensagem %}<p class="erro">{{ mensagem }}</p>{% endif %}
    <form action="{{ url_for('admin.login_admin') }}" method="post">
        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" autocomplete="username" required>
        <label for="senha">Senha</label>
        <input id="senha" name="senha" type="password" autocomplete="current-password" required>
        <button type="submit">Entrar como administrador</button>
    </form>
    <p><a href="{{ url_for('auth.pagina_principal') }}">Voltar ao login comum</a></p>
</main></body>
</html>
